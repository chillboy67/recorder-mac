name: Windows and Linux CI

on:
  push:
    branches: [main]
    paths:
      - "lecture_intel/**"
      - ".github/workflows/platform-ci.yml"
  pull_request:
    paths:
      - "lecture_intel/**"
      - ".github/workflows/platform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python 3.11
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg --no-progress -y
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 pipewire-bin pulseaudio-utils
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: lecture_intel/requirements.txt
      - name: Install app and test dependencies
        run: python -m pip install -r lecture_intel/requirements.txt pytest
      - name: Transcribe an uploaded audio fixture
        working-directory: lecture_intel
        shell: bash
        run: |
          python -c "import math,struct,wave; w=wave.open('ci-upload.wav','wb'); w.setparams((1,2,16000,0,'NONE','not compressed')); w.writeframes(b''.join(struct.pack('<h',int(12000*math.sin(2*math.pi*440*i/16000))) for i in range(16000))); w.close()"
          python transcribe.py ci-upload.wav --engine faster-whisper --model small -f txt -f json -o ci-upload-output
          python -c "from pathlib import Path; import json,wave; p=Path('ci-upload-output'); assert (p/'ci-upload.txt').is_file(); assert (p/'ci-upload.json').is_file(); json.loads((p/'ci-upload.json').read_text()); assert wave.open('ci-upload.wav').getnframes() > 0"
      - name: Compile Python sources
        working-directory: lecture_intel
        run: python -m compileall -q core gui eval
      - name: Check Linux system-audio helper
        if: runner.os == 'Linux'
        working-directory: lecture_intel
        run: |
          sudo apt-get install -y pipewire-bin pulseaudio-utils
          python native/SystemAudioRecorderLinux.py --capabilities
      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build Windows system-audio helper
        if: runner.os == 'Windows'
        working-directory: lecture_intel
        shell: pwsh
        run: |
          .\build_windows_helper.ps1
          .\native\system_audio_recorder.exe --capabilities
      - name: Run core tests
        working-directory: lecture_intel
        run: python -m pytest -q tests -k "not test_export_all_formats"
      - name: Run offscreen GUI tests
        working-directory: lecture_intel
        env:
          RECORDER_GUI_TESTS: "1"
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_gui.py
      - name: Build and smoke-test the Windows system-audio helper
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: lecture_intel
        run: |
          ./build_windows_helper.ps1
          $capabilities = & ./native/system_audio_recorder.exe --capabilities | Out-String
          if ($capabilities -notmatch 'STDIN_CONTROL_V1') {
            throw "Helper is missing the control-protocol marker: $capabilities"
          }
          Write-Host "capabilities: $capabilities"
      - name: Smoke-test the Linux system-audio helper
        if: runner.os == 'Linux'
        working-directory: lecture_intel
        run: |
          python native/SystemAudioRecorderLinux.py --capabilities
          python -c "import sys; sys.path.insert(0, '.'); from core import sysaudio; assert sysaudio.available(), sysaudio.binary_path(); print('available:', sysaudio.binary_path())"
