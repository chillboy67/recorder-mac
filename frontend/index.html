<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline IELTS Speaking Coach</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <div class="backdrop" aria-hidden="true">
      <span class="glow glow-a"></span>
      <span class="glow glow-b"></span>
    </div>

    <main class="app-shell">
      <section class="workspace">
        <header class="topbar">
          <div class="brand">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3Z"/>
                <path d="M5.5 11a6.5 6.5 0 0 0 13 0"/>
                <path d="M12 17.5V21"/>
              </svg>
            </span>
            <div>
              <p class="eyebrow">Local · Offline</p>
              <h1>IELTS Speaking Coach</h1>
              <p class="tagline">雅思口语 · 本地批改工作台</p>
            </div>
          </div>
          <div class="privacy">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 3 5 6v5c0 4.5 3 8 7 10 4-2 7-5.5 7-10V6l-7-3Z"/>
              <path d="m9.2 12 2 2 3.6-4"/>
            </svg>
            <span>离线运行，不上传音频</span>
          </div>
        </header>

        <div class="layout">
          <section class="panel input-panel">
            <div class="panel-caption">
              <span class="step-dot">1</span>
              <h2 class="panel-title">输入</h2>
            </div>

            <div class="segmented" aria-label="输入模式">
              <button id="audioMode" class="active" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M12 4a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V7a3 3 0 0 1 3-3Z"/>
                  <path d="M6 11.5a6 6 0 0 0 12 0"/>
                  <path d="M12 17.5V20"/>
                </svg>
                音频
              </button>
              <button id="textMode" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M4 6h16"/>
                  <path d="M4 12h16"/>
                  <path d="M4 18h10"/>
                </svg>
                文本
              </button>
            </div>

            <div class="field">
              <span class="field-label">考试部分</span>
              <div class="part-selector" aria-label="考试部分">
                <button id="part1Button" type="button" data-speaking-part="part1">
                  <strong>Part 1</strong><small>日常问答</small>
                </button>
                <button id="part2Button" class="active" type="button" data-speaking-part="part2">
                  <strong>Part 2</strong><small>话题陈述</small>
                </button>
                <button id="part3Button" type="button" data-speaking-part="part3">
                  <strong>Part 3</strong><small>深入讨论</small>
                </button>
              </div>
            </div>

            <label id="dropzone" class="dropzone">
              <span class="upload-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 16V6.5"/>
                  <path d="m8 10 4-4 4 4"/>
                  <path d="M5 16.5V18a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-1.5"/>
                </svg>
              </span>
              <span id="audioName" class="dropzone-title">上传雅思口语音频</span>
              <span class="dropzone-hint">点击选择或拖拽文件 · 支持 m4a / mp3 / wav</span>
              <input id="audioInput" type="file" accept="audio/*,.m4a,.mp3,.wav" />
            </label>

            <section id="recorderPanel" class="recorder-panel" aria-label="本地录音">
              <div class="recorder-status">
                <span id="recordingDot" class="recording-dot"></span>
                <span id="recordingStatus">可直接录音，录完后点生成反馈</span>
                <strong id="recordingTimer">00:00</strong>
              </div>
              <div class="recorder-actions">
                <button id="startRecordButton" class="secondary" type="button">
                  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="6"/></svg>
                  开始录音
                </button>
                <button id="stopRecordButton" class="secondary danger" type="button" disabled>
                  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
                  停止
                </button>
                <button id="clearRecordButton" class="secondary" type="button" disabled>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M5 7h14"/>
                    <path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7"/>
                    <path d="M7 7l1 12a1.5 1.5 0 0 0 1.5 1.4h5A1.5 1.5 0 0 0 16 19l1-12"/>
                  </svg>
                  清除
                </button>
              </div>
              <audio id="recordingPreview" class="recording-preview hidden" controls></audio>
            </section>

            <label id="studentField" class="field">
              <span class="field-label" id="textLabel">学生发言</span>
              <textarea id="textInput" placeholder="只粘贴学生回答；如果有多人转写，可用 学生：... / 助教：... 标注，系统会优先提取学生发言。"></textarea>
            </label>

            <label class="field">
              <span class="field-label">助教初步纠正 <em class="optional">选填</em></span>
              <textarea id="assistantNotesInput" class="assistant-box" placeholder="粘贴助教已经指出的正确纠正，例如：Q2 注意三单；plan 的发音需要改。会作为补充参考，不作为主要批改对象。"></textarea>
            </label>

            <button id="submitButton" class="primary" type="button" disabled>
              <span class="spinner" aria-hidden="true"></span>
              <span class="primary-label">生成反馈</span>
            </button>
            <p id="errorBox" class="error hidden"></p>
          </section>

          <section class="panel result-panel">
            <div class="result-header">
              <div class="panel-caption">
                <span class="step-dot">2</span>
                <div>
                  <h2 class="panel-title">批改报告</h2>
                </div>
              </div>
              <button id="copyButton" class="icon-button" type="button" disabled title="复制报告">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="9" y="9" width="11" height="11" rx="2"/>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                </svg>
              </button>
            </div>

            <div id="emptyState" class="empty">
              <span class="empty-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M7 3h8l4 4v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/>
                  <path d="M15 3v4h4"/>
                  <path d="M9.5 12h6"/>
                  <path d="M9.5 15.5h6"/>
                  <path d="M9.5 8.5h2"/>
                </svg>
              </span>
              <p class="empty-title">报告会出现在这里</p>
              <p>上传音频或粘贴文本后，点击「生成反馈」，即可查看雅思口语批改结果。</p>
            </div>
            <div id="warnings" class="warnings hidden"></div>
            <article id="report" class="report"></article>
          </section>
        </div>

        <footer class="footnote">
          <span>All processing stays on this machine · 音频与文本均不离开本机</span>
        </footer>
      </section>
    </main>
    <script src="/assets/app.js"></script>
  </body>
</html>
